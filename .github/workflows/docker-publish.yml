name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: latest
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Seqgen
            org.opencontainers.image.description=Cryptographically secure data generators

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Prepare release asset names
        if: github.event_name == 'push'
        id: release-assets
        shell: bash
        run: |
          safe_tag="${GITHUB_REF_NAME//\//-}"
          echo "docker_tag=${safe_tag}" >> "$GITHUB_OUTPUT"
          echo "amd64=${RUNNER_TEMP}/seqgen-${safe_tag}-linux-amd64.tar" >> "$GITHUB_OUTPUT"
          echo "arm64=${RUNNER_TEMP}/seqgen-${safe_tag}-linux-arm64.tar" >> "$GITHUB_OUTPUT"
          echo "checksum=${RUNNER_TEMP}/seqgen-${safe_tag}-SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Export linux/amd64 release image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: seqgen:${{ steps.release-assets.outputs.docker_tag }}
          outputs: type=docker,dest=${{ steps.release-assets.outputs.amd64 }}
          cache-from: type=gha

      - name: Export linux/arm64 release image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          tags: seqgen:${{ steps.release-assets.outputs.docker_tag }}
          outputs: type=docker,dest=${{ steps.release-assets.outputs.arm64 }}
          cache-from: type=gha

      - name: Compress release images and create checksums
        if: github.event_name == 'push'
        shell: bash
        run: |
          gzip --best "${{ steps.release-assets.outputs.amd64 }}"
          gzip --best "${{ steps.release-assets.outputs.arm64 }}"
          cd "${RUNNER_TEMP}"
          sha256sum \
            "$(basename "${{ steps.release-assets.outputs.amd64 }}").gz" \
            "$(basename "${{ steps.release-assets.outputs.arm64 }}").gz" \
            > "${{ steps.release-assets.outputs.checksum }}"

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMD64_ARCHIVE: ${{ steps.release-assets.outputs.amd64 }}.gz
          ARM64_ARCHIVE: ${{ steps.release-assets.outputs.arm64 }}.gz
          CHECKSUM_FILE: ${{ steps.release-assets.outputs.checksum }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${AMD64_ARCHIVE}" \
              "${ARM64_ARCHIVE}" \
              "${CHECKSUM_FILE}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${AMD64_ARCHIVE}" \
              "${ARM64_ARCHIVE}" \
              "${CHECKSUM_FILE}" \
              --verify-tag \
              --generate-notes \
              --notes "Docker image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}\`"
          fi
